name: Web Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/src/**'
      - 'public/wasm/**'
      - 'scripts/build_wasm.sh'
      - 'tests/**'
      - 'server.js'
      - 'package.json'
      - 'vite.config.*'
      - '.github/workflows/build-wasm.yml'
      - '.github/workflows/web-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    name: Web render and multi-pitch tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build and stage the exact WASM used by regression tests
        run: |
          bash scripts/build_wasm.sh build/wasm
          mkdir -p public/wasm assets/src/wasm
          cp build/wasm/vose_core.js public/wasm/vose_core.js
          cp build/wasm/vose_core.js assets/src/wasm/vose_core.js
          cp build/wasm/vose_core.wasm public/wasm/vose_core.wasm
      - name: Install dependencies
        run: npm install
      - name: Run Web regression tests
        run: npm run test:web
      - name: Build Web application
        run: npm run build
