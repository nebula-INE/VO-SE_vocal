name: "🎙️ VO-SE Pro: Official Engine Builder (Integrated)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# [FIX] 同じブランチへの連続pushで新旧ワークフローが同じ "latest" リリースを
# 同時に更新して競合するのを防ぐ。前の実行が残っていればキャンセルする。
concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    name: "🛠️ Build & Pack on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # [FIX-CI-ACTIONS] actions/checkout@v6 / setup-python@v6 は存在しない。
        # 2026年6月現在の最新安定版 v4 に統一。
        os: [windows-latest, macos-15, ubuntu-22.04]

    steps:
      - name: "📂 [Step 1] Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 [Step 2] Setup Python Environment"
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: "🔎 Record Linux compatibility baseline"
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          echo "Linux release baseline: $(getconf GNU_LIBC_VERSION)"
          ldd --version | head -n 1

      - name: "🧩 [Step 3] Install OS Dependencies (Linux)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxrender1 libxi6 \
            libsm6 libxext6 libfontconfig1 \
            libpulse0 libasound2 libsndfile1 portaudio19-dev

      - name: "🧩 [Step 3] Install OS Dependencies (macOS)"
        if: runner.os == 'macOS'
        run: brew install portaudio libsndfile

      - name: "📦 [Step 4] Install Python Dependencies"
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip wheel setuptools

          # --- 事前ビルド版を先に入れて pyopenjtalk のソースビルドを回避 ---
          # macOS / Linux 両方で有効。Windows でも問題なければ同様に入れてOK。
          python -m pip install --upgrade pyopenjtalk-prebuilt

          # requirements をインストール（prebuilt があればそちらが優先されます）
          python -m pip install -r requirements.txt

          # 必要ランタイム（任意で追加）
          python -m pip install Pillow PySide6 sounddevice soundfile

          # デバッグ出力
          python - <<'PY'
          import importlib, sys, subprocess
          def show(pkg):
              try:
                  m = importlib.import_module(pkg)
                  print(f"OK: {pkg} ->", getattr(m, "__version__", "version-unknown"))
              except Exception as e:
                  print(f"MISS: {pkg} -> {e}")
          for p in ("pyopenjtalk","pyopenjtalk_prebuilt","cmake"):
              show(p)
          subprocess.run(["cmake","--version"], check=False)
          PY


      - name: "📂 [Step 5] Prepare Directory"
        shell: bash
        run: mkdir -p bin src/world assets dist_out build

      - name: "🎙️ [Step 6] Pack Official Voice Data"
        run: python modules/tools/pack_all_voices.py

      - name: "🔍 Verify bin contents"
        shell: bash
        run: |
          echo "=== bin/ の中身 ==="
          ls -la bin/ 2>/dev/null || echo "bin/ が存在しません"

      - name: "🔧 Setup MSVC (Windows only)"
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: "🏗️ [Step 7] Compile Engine"
        shell: bash
        run: |
          # PR #35 moved the native engine sources from src/ to assets/src/.
          # Stage them into src/ so the existing per-OS compiler commands and
          # include layout remain consistent without modifying DSP source files.
          cp assets/src/*.cpp src/
          cp assets/src/world/*.cpp src/world/
          cp include/world/*.h src/world/
          cp include/*.h src/

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmd //c "cl.exe /std:c++17 /EHsc /O2 /LD /D_USE_MATH_DEFINES \
              /Fe:bin\\vose_core.dll \
              src\\vose_core.cpp \
              src/vose_streaming_final.cpp \
              src\\world\\cheaptrick.cpp \
              src\\world\\common.cpp \
              src\\world\\d4c.cpp \
              src\\world\\dio.cpp \
              src\\world\\fft.cpp \
              src\\world\\harvest.cpp \
              src\\world\\matlabfunctions.cpp \
              src\\world\\stonemask.cpp \
              src\\world\\synthesis.cpp \
              src\\world\\audioio.cpp \
              /I src /I include /I src\\world \
              /link"

          elif [ "${{ matrix.os }}" = "macos-15" ]; then
            mkdir -p build/macos-world
            for f in src/world/*.cpp; do
              [ -e "$f" ] || continue
              obj="build/macos-world/$(basename "${f%.cpp}").o"
              clang++ -O3 -fPIC -ffast-math -c -std=c++17 -stdlib=libc++ -mmacosx-version-min=11.0 \
                -D_USE_MATH_DEFINES \
                -I./src -I./include -I./src/world \
                "$f" -o "$obj"
            done

            clang++ -O3 -dynamiclib -std=c++17 -stdlib=libc++ \
              -mmacosx-version-min=11.0 \
              -I./src -I./include -I./src/world \
              -o bin/libvose_core.dylib \
              src/vose_core.cpp \
              src/vose_streaming_final.cpp \
              build/macos-world/*.o
          else
            mkdir -p build/linux-world
            for f in src/world/*.cpp; do
              [ -e "$f" ] || continue
              obj="build/linux-world/$(basename "${f%.cpp}").o"
              g++ -O3 -fPIC -ffast-math -c -std=c++17 \
                -D_USE_MATH_DEFINES \
                -I./src -I./include -I./src/world \
                "$f" -o "$obj"
            done

            g++ -O3 -fPIC -shared -std=c++17 \
              -Wl,-soname,libvose_core.so \
              -I./src -I./include -I./src/world \
              -o bin/libvose_core.so \
              src/vose_core.cpp \
              src/vose_streaming_final.cpp \
              build/linux-world/*.o
          fi

      - name: "🔍 Verify DLL/dylib"
        shell: bash
        run: ls -la bin/

      - name: "🌐 Web multi-pitch Render → WAV mapping regression"
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run test:web

      - name: "🧪 Native multi-pitch Render → WAV → Playback regression"
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          VOSE_RUN_NATIVE_RENDER_TEST: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/test_multi_pitch_render_playback.py -v -m integration --maxfail=1

      # [FIX] 生成された共有ライブラリのサイズを可視化。
      # 想定外に大きい場合はここでビルドを止めて早期に気付けるようにする。
      - name: "📏 Sanity-check core library size"
        shell: bash
        run: |
          set -euo pipefail
          for f in bin/*.dll bin/*.dylib bin/*.so; do
            [ -e "$f" ] || continue
            SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f -> $SIZE bytes"
            # 100MB を超えたら異常とみなして失敗させる（通常は数MB程度のはず）
            if [ "$SIZE" -gt 104857600 ]; then
              echo "::error::$f is unexpectedly large ($SIZE bytes). Aborting before packaging/release."
              exit 1
            fi
          done

      - name: "📦 [Step 8] Package Integrated Executable (PyInstaller)"
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pyinstaller --noconsole --onefile \
              --add-data "bin/vose_core.dll;bin" \
              --add-data "assets;assets" \
              --distpath ./dist_out --name "VO-SE_PRO_Win" main.py
          elif [ "${{ matrix.os }}" = "macos-15" ]; then
            pyinstaller --noconsole --windowed \
              --add-data "bin/libvose_core.dylib:bin" \
              --add-data "assets:assets" \
              --distpath ./dist_out --name "VO-SE_PRO_Mac" main.py
            cd dist_out && zip -r VO-SE_PRO_Mac.zip VO-SE_PRO_Mac.app && cd ..
           else
            pyinstaller --noconsole --onefile \
              --add-data "bin/libvose_core.so:bin" \
              --add-data "assets:assets" \
              --distpath ./dist_out --name "VO-SE_PRO_Linux" main.py
            chmod +x dist_out/VO-SE_PRO_Linux
          fi


      - name: "🧪 Startup Smoke Test (real packaged binary)"
        shell: bash
        env:
          VOSE_STARTUP_SMOKE_TEST: "1"
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            windows-latest)
              EXE="./dist_out/VO-SE_PRO_Win.exe"
              ;;
            macos-15)
              EXE="./dist_out/VO-SE_PRO_Mac.app/Contents/MacOS/VO-SE_PRO_Mac"
              ;;
            ubuntu-22.04)
              EXE="./dist_out/VO-SE_PRO_Linux"
              ;;
          esac

          test -f "$EXE"
          echo "Starting packaged binary: $EXE"

          python - "$EXE" <<'PY'
          import os
          import subprocess
          import sys
          import time

          exe = sys.argv[1]
          env = os.environ.copy()
          env["VOSE_STARTUP_SMOKE_TEST"] = "1"
          env.setdefault("QT_QPA_PLATFORM", "offscreen")

          startup_window = 8.0
          proc = subprocess.Popen(
              [exe],
              env=env,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          try:
              deadline = time.monotonic() + startup_window
              while proc.poll() is None and time.monotonic() < deadline:
                  time.sleep(0.25)

              returncode = proc.poll()
              if returncode is not None:
                  stdout, stderr = proc.communicate()
                  print(f"Packaged application exited during startup with code: {returncode}")
                  print(f"STDOUT:{stdout}")
                  print(f"STDERR:{stderr}")
                  if returncode != 0:
                      print("::error::Packaged application exited unexpectedly during startup.")
                      raise SystemExit(returncode)

              # GUI applications are expected to keep their event loop alive.
              # Reaching this point means the packaged binary survived startup.
              print(f"Packaged application remained alive for {startup_window:.0f}s; startup succeeded.")

              proc.terminate()
              try:
                  stdout, stderr = proc.communicate(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  stdout, stderr = proc.communicate()

              print(f"STDOUT:{stdout}")
              print(f"STDERR:{stderr}")
          finally:
              if proc.poll() is None:
                  proc.kill()
                  proc.communicate()
          PY

      - name: "🔍 Debug: List files before release"
        shell: bash
        run: |
          echo "--- dist_out content ---"
          find dist_out -maxdepth 2
          echo "--- bin content ---"
          find bin -maxdepth 2 -type f -print

      # Stage only the distributable files. On macOS, dist_out also contains the
      # expanded .app bundle (17k+ files); the ZIP created above is the release
      # deliverable, so uploading both needlessly bloats artifact registration.
      - name: "📦 Stage distributable artifacts"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact_staging

          case "${{ matrix.os }}" in
            windows-latest)
              cp dist_out/VO-SE_PRO_Win.exe artifact_staging/
              compgen -G 'bin/*.dll' > /dev/null
              cp bin/*.dll artifact_staging/
              ;;
            macos-15)
              test -s dist_out/VO-SE_PRO_Mac.zip
              cp dist_out/VO-SE_PRO_Mac.zip artifact_staging/
              compgen -G 'bin/*.dylib' > /dev/null
              cp bin/*.dylib artifact_staging/
              ;;
            ubuntu-22.04)
              cp dist_out/VO-SE_PRO_Linux artifact_staging/
              compgen -G 'bin/*.so' > /dev/null
              cp bin/*.so artifact_staging/
              ;;
            *)
              echo "::error::Unsupported release matrix target: ${{ matrix.os }}"
              exit 1
              ;;
          esac

          echo "=== Staged distributables ==="
          find artifact_staging -maxdepth 1 -type f -print
          test -n "$(find artifact_staging -maxdepth 1 -type f -print -quit)"

      - name: "📦 Upload Artifacts for Workflow"
        uses: actions/upload-artifact@v4
        with:
          name: VO-SE-Build-${{ matrix.os }}
          path: artifact_staging/
          if-no-files-found: error
          retention-days: 7

  # =============================================================================
  # [FIX] リリース公開を独立したジョブに分離。
  # build マトリクスの3ジョブが同時に同じリリース(tag_name: latest)へ書き込むと
  # softprops/action-gh-release の削除→再アップロードが競合し、アセットが破損
  # して "size must be less than 2147483648" のようなエラーになることがある。
  # このジョブは build 完了後に1回だけ実行され、全OS分の成果物を一括で
  # まとめてアップロードするため、競合が起きない。
  # =============================================================================
  release:
    name: "🚀 Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "📥 Download all build artifacts"
        uses: actions/download-artifact@v4
        with:
          pattern: VO-SE-Build-*
          path: release_assets
          merge-multiple: true

      - name: "🔍 Debug: List release assets"
        shell: bash
        run: |
          echo "--- release_assets content ---"
          find release_assets -maxdepth 2 -type f -print
          echo "--- sizes ---"
          find release_assets -maxdepth 2 -type f -exec ls -lh {} \;

      # GitHub Release assets are limited to less than 2 GiB each.
      # Keep the executable byte-for-byte identical; only split the transport file.
      - name: "🧩 Split Linux Release Asset Under GitHub's 2 GiB Limit"
        shell: bash
        run: |
          set -euo pipefail
          linux_binary="release_assets/VO-SE_PRO_Linux"
          test -s "$linux_binary"

          split --bytes=1800M --numeric-suffixes=1 --suffix-length=2 \
            "$linux_binary" "$linux_binary.part-"

          (
            cd release_assets
            sha256sum VO-SE_PRO_Linux > VO-SE_PRO_Linux.sha256
          )

          cat > release_assets/VO-SE_PRO_Linux_assemble.sh <<'ASSEMBLE'
          #!/usr/bin/env bash
          set -euo pipefail

          script_dir="$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)"
          output="$script_dir/VO-SE_PRO_Linux"
          checksum_file="$script_dir/VO-SE_PRO_Linux.sha256"

          if [[ ! -s "$checksum_file" ]]; then
            echo "Missing VO-SE_PRO_Linux.sha256" >&2
            exit 1
          fi

          shopt -s nullglob
          parts=( "$script_dir"/VO-SE_PRO_Linux.part-* )
          if (( ${#parts[@]} == 0 )); then
            echo "No VO-SE_PRO_Linux.part-* files found beside this script." >&2
            exit 1
          fi

          temp_file="$(mktemp "$script_dir/.VO-SE_PRO_Linux.XXXXXX")"
          cleanup() {
            rm -f "$temp_file"
          }
          trap cleanup EXIT

          cat "${parts[@]}" > "$temp_file"
          expected="$(awk 'NR == 1 { print $1 }' "$checksum_file")"
          actual="$(sha256sum "$temp_file" | awk '{ print $1 }')"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ || "$actual" != "$expected" ]]; then
            echo "SHA-256 verification failed; the executable was not installed." >&2
            exit 1
          fi

          chmod 755 "$temp_file"
          mv -f "$temp_file" "$output"
          trap - EXIT
          echo "Created and verified: $output"
          echo "Run it with: ./VO-SE_PRO_Linux"
          ASSEMBLE
          chmod +x release_assets/VO-SE_PRO_Linux_assemble.sh

          cat > release_assets/VO-SE_PRO_Linux_README.txt <<'README'
          VO-SE PRO - Linux portable build

          1. Download every VO-SE_PRO_Linux.part-* file, plus:
             - VO-SE_PRO_Linux.sha256
             - VO-SE_PRO_Linux_assemble.sh
          2. Put all downloaded files in the same directory. Do not rename the parts.
          3. Run: bash VO-SE_PRO_Linux_assemble.sh
          4. The script joins the parts, verifies SHA-256, and creates the executable.
          5. Run: ./VO-SE_PRO_Linux

          All parts are required. The original executable is preserved byte-for-byte.
          README

          bash -n release_assets/VO-SE_PRO_Linux_assemble.sh
          shopt -s nullglob
          parts=( release_assets/VO-SE_PRO_Linux.part-* )
          if (( ${#parts[@]} == 0 )); then
            echo "::error::No Linux release parts were generated."
            exit 1
          fi
          for part in "${parts[@]}"; do
            size="$(stat -c '%s' "$part")"
            if (( size >= 2147483648 )); then
              echo "::error::Release part exceeds GitHub's 2 GiB asset limit: $part ($size bytes)"
              exit 1
            fi
          done

          # Confirm the ordered parts reconstruct the exact original executable.
          cat "${parts[@]}" | cmp -s - "$linux_binary"
          echo "Split parts: ${#parts[@]}"
          ls -lh release_assets/VO-SE_PRO_Linux.part-*
          rm "$linux_binary"

      - name: "🧹 Remove stale Linux single-file release assets"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          existing_assets="$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || true)"
          while IFS= read -r asset; do
            case "$asset" in
              VO-SE_PRO_Linux|VO-SE_PRO_Linux.part-*|VO-SE_PRO_Linux.sha256|VO-SE_PRO_Linux_assemble.sh|VO-SE_PRO_Linux_README.txt)
                echo "Removing stale Linux release asset: $asset"
                gh release delete-asset latest "$asset" --yes
                ;;
            esac
          done <<< "$existing_assets"

      - name: "🚀 [Step 9] Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "VO-SE PRO (Official Edition)"
          files: |
            release_assets/VO-SE_PRO_Win.exe
            release_assets/*.dll
            release_assets/VO-SE_PRO_Mac.zip
            release_assets/*.dylib
            release_assets/VO-SE_PRO_Linux.part-*
            release_assets/VO-SE_PRO_Linux.sha256
            release_assets/VO-SE_PRO_Linux_assemble.sh
            release_assets/VO-SE_PRO_Linux_README.txt
            release_assets/*.so
          fail_on_unmatched_files: false
          generate_release_notes: true
          make_latest: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
