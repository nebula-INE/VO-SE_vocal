name: Build WebAssembly Engine
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build WebAssembly Module
        run: |
          mkdir -p build/wasm
          cp include/world/*.h src/world/
          em++ -DVOSE_BUILD_ID=\"$GITHUB_SHA\" src/vose_core.cpp \
               src/world/audioio.cpp \
               src/world/cheaptrick.cpp \
               src/world/common.cpp \
               src/world/d4c.cpp \
               src/world/dio.cpp \
               src/world/fft.cpp \
               src/world/harvest.cpp \
               src/world/matlabfunctions.cpp \
               src/world/stonemask.cpp \
               src/world/synthesis.cpp \
               -Iinclude \
               -O3 \
               -std=c++17 \
               -fexceptions \
               -s WASM=1 \
               -s ALLOW_MEMORY_GROWTH=1 \
               -s ALLOW_TABLE_GROWTH=1 \
               -s MODULARIZE=1 \
               -s EXPORT_NAME="createVoseCoreModule" \
               -s EXPORT_ES6=1 \
               -s ENVIRONMENT=web,worker \
               -s ASSERTIONS=1 \
               -s DISABLE_EXCEPTION_CATCHING=0 \
               -s EXPORTED_FUNCTIONS="['_load_embedded_resource', '_load_embedded_resource_f32', '_execute_render', '_execute_render_cancelable', '_set_oto_data', '_set_vocal_timeline', '_get_engine_version', '_get_engine_build_id', '_clear_engine_cache', '_malloc', '_free']" \
               -s EXPORTED_RUNTIME_METHODS="['ccall', 'cwrap', 'getValue', 'setValue', 'FS', 'stringToUTF8', 'lengthBytesUTF8', 'addFunction', 'removeFunction', 'HEAPU8', 'HEAPF32', 'HEAPF64']" \
               -s DEFAULT_TO_CXX \
               -o build/wasm/vose_core.js

      - name: Patch Emscripten runtime imports for browser compatibility
        run: |
          node scripts/patch_wasm_runtime.mjs build/wasm/vose_core.js
          grep -q "invoke_ilj:invoke_ilj," build/wasm/vose_core.js
          echo "Required env.invoke_ilj bridge is explicitly bound."

      - name: Verify WASM import contract against generated loader
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const wasm = readFileSync('build/wasm/vose_core.wasm');
          const loader = readFileSync('build/wasm/vose_core.js', 'utf8');
          const module = new WebAssembly.Module(wasm);
          const imports = WebAssembly.Module.imports(module);
          const invokeImports = imports
            .filter((entry) => entry.module === 'env' && entry.name.startsWith('invoke_'))
            .map((entry) => entry.name)
            .sort();
          console.log('Generated WASM invoke imports:', invokeImports.join(', '));
          if (invokeImports.includes('invoke_ilj') && !loader.includes('invoke_ilj:invoke_ilj')) {
            throw new Error('WASM requires env.invoke_ilj but generated loader does not bind invoke_ilj');
          }
          console.log('WASM import contract is compatible with the generated loader.');
          NODE

      - name: Verify required WebAssembly exports
        run: |
          set -eu
          grep -q "_load_embedded_resource_f32" build/wasm/vose_core.js
          grep -q "_execute_render_cancelable" build/wasm/vose_core.js
          grep -q "_set_oto_data" build/wasm/vose_core.js
          grep -q "_get_engine_version" build/wasm/vose_core.js
          grep -q "_get_engine_build_id" build/wasm/vose_core.js
          echo "Required vose_core WASM exports are present."

      - name: Verify current source diagnostics are compiled
        run: |
          set -eu
          # C++ string literals are normally stored in the WASM data section,
          # not necessarily in the generated JavaScript loader.
          grep -a -q -- "source waveform is silent" build/wasm/vose_core.wasm
          grep -a -q -- "WORLD synthesis produced silence" build/wasm/vose_core.wasm
          echo "Current silent-render diagnostics are present in the WASM binary."

      - name: Deploy build output into repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          mkdir -p public/wasm
          cp build/wasm/vose_core.js public/wasm/vose_core.js
          cp build/wasm/vose_core.js src/wasm/vose_core.js
          cp build/wasm/vose_core.wasm public/wasm/vose_core.wasm

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Do not fetch the repository's unrelated LFS history here.
          # The generated WASM files are committed as ordinary repository files.
          # Fetching a stale/missing LFS object can fail deployment after a
          # successful WASM build.

          git add public/wasm/vose_core.js public/wasm/vose_core.wasm
          if git diff --cached --quiet; then
            echo "No changes to commit (build output identical to previous commit)."
          else
            git commit -m "chore: update vose_core.wasm build [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload WebAssembly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vose-wasm-engine
          path: build/wasm/
