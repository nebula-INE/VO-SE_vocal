name: Build WebAssembly Engine
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# ★追加: リポジトリ側の "Workflow permissions" 設定が Read-only の場合、
# デフォルトの GITHUB_TOKEN では git push が 403 で拒否される。
# ここで明示的に contents: write を宣言することで、リポジトリ側の設定を
# 変更しなくてもこのワークフローだけ書き込み権限を持てるようにする。
permissions:
  contents: write

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build WebAssembly Module
        run: |
          mkdir -p build/wasm
          cp include/world/*.h src/world/
          # Compile WORLD vocoder and vose_core with Emscripten
          # ★変更点1: -s MODULARIZE=1 -s EXPORT_NAME='createVoseCoreModule' を追加。
          #   これが無いとブラウザのグローバルスコープに直接 Module を生やす形式になり、
          #   Vite等のバンドラからESモジュールとして安全にimportできない。
          # ★変更点2: -s EXPORTED_RUNTIME_METHODS に FS を追加。
          #   execute_render() が仮想ファイルシステムへ書き出す output.wav を
          #   JS側から Module.FS.readFile() で読み出すために必要。
          # ★変更点3: -s ENVIRONMENT=web で不要なNode.js向けコードを除外し軽量化。
          # ★変更点4: -s EXPORT_ES6=1 を追加。
          #   voseCoreWorker.ts は type:'module' のWeb Worker内で動くが、
          #   モジュールWorker内では importScripts() が使えない(仕様上非対応で
          #   例外になる)。EXPORT_ES6=1 で vose_core.js 自体を
          #   `export default createVoseCoreModule` を持つ正式なESモジュールに
          #   ビルドし、Worker側は動的 import() で読み込む形に統一する。
          # ★変更点5: addFunction / removeFunction をランタイムメソッドに追加し、
          #   -s ALLOW_TABLE_GROWTH=1 を付与。execute_render_cancelable() の
          #   進捗コールバック(JS関数)をC関数ポインタとして渡せるようにするため。
          # ★変更点6: EXPORTED_FUNCTIONS に '_set_oto_data' を追加。
          #   vose_core.cpp / vose_core.h には set_oto_data() が実装されており
          #   デスクトップ版のネイティブDLLローダーもこれをバインドしているが、
          #   このWASMビルドの EXPORTED_FUNCTIONS からだけ抜けていた。
          #   これが無いとWeb版はoto.ini由来のタイミング(offset/consonant/
          #   cutoff/preutterance/overlap)を一切C++側に渡せず、
          #   常に kDefaultOto (全フィールド0) でレンダリングされてしまう。
          # ★変更点7: EXPORTED_RUNTIME_METHODS に 'HEAPU8' と 'HEAPF64' を追加。
          #   voseCoreWorker.ts は PCM16データやNoteEvent/OtoEntry構造体を
          #   WASMメモリへ直接書き込むために Module.HEAPU8.set()/HEAPF64.set()
          #   を使っているが、これらのメモリビューはランタイムメソッドとして
          #   明示的にエクスポートしないとMODULARIZE=1のビルドでは
          #   Module(=mod)オブジェクト上に生えず、`mod.HEAPU8` が undefined
          #   になって "undefined is not an object" で失敗する。
          # ★変更点8(一時的なデバッグ用): -s ASSERTIONS=2 と -g2 を追加。
          #   "Aborted(undefined). Build with -sASSERTIONS for more info."
          #   というエラーで原因不明のままクラッシュしていたため、詳細な
          #   エラーメッセージ(不正なポインタアクセス/型不一致等)を
          #   出させるために付与。原因が特定できたら外してよい
          #   (バイナリサイズと実行速度に多少ペナルティがあるため)。
          # ★変更点9: -fexceptions と -s DISABLE_EXCEPTION_CATCHING=0 を追加。
          #   実機で "Assertion failed: Exception thrown, but exception
          #   catching is not enabled" というエラーで、レンダリング中盤の
          #   特定ノートでC++側の例外が投げられた際に強制中断していた。
          #   vose_core.cpp の synthesize_note_impl 呼び出し箇所(L1729-1743)
          #   と set_bigvgan_model(L2252-2258) には元々 try/catch が書かれて
          #   いたが、Emscriptenはデフォルトで例外機構を無効化(バイナリ
          #   サイズ削減のため)するため、この try/catch が機能せず
          #   ハードクラッシュになっていた。これを有効化することで、
          #   個々のノート合成失敗時に例外がキャッチされ
          #   (worker_error_msgにe.what()が格納される)、曲全体がクラッシュ
          #   することなく処理を継続できる想定。
          # ★変更点10(一時的なデバッグ用): -s SAFE_HEAP=1 を追加。
          #   "Out of bounds memory access (evaluating
          #   'getWasmTableEntry(index)(a1...a8)')" という、関数ポインタ
          #   経由の間接呼び出しがWASMテーブル上の無効な場所を指す
          #   エラーが発生した。これは典型的にどこかでメモリの範囲外
          #   書き込みが起きて関数テーブル(あるいはそれを指すポインタ)を
          #   破壊したことを示唆する。SAFE_HEAPは全てのヒープ読み書きに
          #   境界・アライメントチェックを挟み、違反時に正確なアドレスと
          #   型を報告してくれるため、voseCoreWorker.ts側の手組みの
          #   構造体マーシャリング(NoteEvent/OtoEntry)を含め、実際の
          #   メモリ破壊の発生源を特定するために使う。原因が特定できたら
          #   外してよい(実行速度への影響が大きいため)。
          em++ src/vose_core.cpp \
               src/world/audioio.cpp \
               src/world/cheaptrick.cpp \
               src/world/common.cpp \
               src/world/d4c.cpp \
               src/world/dio.cpp \
               src/world/fft.cpp \
               src/world/harvest.cpp \
               src/world/matlabfunctions.cpp \
               src/world/stonemask.cpp \
               src/world/synthesis.cpp \
               -Iinclude \
               -O3 \
               -fexceptions \
               -s WASM=1 \
               -s ALLOW_MEMORY_GROWTH=1 \
               -s ALLOW_TABLE_GROWTH=1 \
               -s MODULARIZE=1 \
               -s EXPORT_NAME="createVoseCoreModule" \
               -s EXPORT_ES6=1 \
               -s ENVIRONMENT=web,worker \
               -s ASSERTIONS=2 \
               -s SAFE_HEAP=1 \
               -s DISABLE_EXCEPTION_CATCHING=0 \
               -g2 \
               -s EXPORTED_FUNCTIONS="['_load_embedded_resource', '_execute_render', '_execute_render_cancelable', '_set_oto_data', '_set_vocal_timeline', '_get_engine_version', '_clear_engine_cache', '_malloc', '_free']" \
               -s EXPORTED_RUNTIME_METHODS="['ccall', 'cwrap', 'getValue', 'setValue', 'FS', 'stringToUTF8', 'lengthBytesUTF8', 'addFunction', 'removeFunction', 'HEAPU8', 'HEAPF64']" \
               -s DEFAULT_TO_CXX \
               -o build/wasm/vose_core.js

      # ★新規追加: ビルド成果物をActionsのArtifactタブに置くだけでは
      # アプリからは絶対に参照されない（誰もダウンロード→手動配置しない限り
      # 永遠に古いビルドのままになる）。ここでリポジトリ内の実際にアプリが
      # 参照するパス(public/wasm/)へ直接コピー＆コミットして、
      # 「ビルドしたのに反映されない」を今後起こさないようにする。
      - name: Deploy build output into repository
        run: |
          mkdir -p public/wasm
          cp build/wasm/vose_core.js public/wasm/vose_core.js
          cp build/wasm/vose_core.wasm public/wasm/vose_core.wasm

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/wasm/vose_core.js public/wasm/vose_core.wasm
          if git diff --cached --quiet; then
            echo "No changes to commit (build output identical to previous commit)."
          else
            git commit -m "chore: update vose_core.wasm build [skip ci]"
            git push
          fi

      - name: Upload WebAssembly Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vose-wasm-engine
          path: build/wasm/
