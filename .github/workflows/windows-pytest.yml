name: "Windows pytest validation"

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/**"
      - "modules/**"
      - "requirements-runtime.txt"
      - "requirements-training.txt"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-pytest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-pytest:
    name: Windows smoke and unit tests
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip "wheel<0.48" setuptools
          python -m pip install -r requirements-runtime.txt
          python -m pip install -r requirements-training.txt
          python -m pip install Pillow PySide6 sounddevice soundfile
          python -m pip install "pytest>=8.0,<9" pytest-xdist pytest-cov pytest-qt pytest-timeout
          python -m pip install pyright

      - name: Run Pyright
        shell: bash
        run: |
          set -euo pipefail
          pyright .

      - name: Run smoke tests
        shell: bash
        timeout-minutes: 45
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: ffmpeg
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/ -v -m smoke --maxfail=1 --timeout=300 --timeout-method=thread --durations=20 -o faulthandler_timeout=180

      - name: Run unit tests with coverage
        shell: bash
        timeout-minutes: 90
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: ffmpeg
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/ -v -m "not smoke" \
            --cov=modules \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            -n 2 \
            -o faulthandler_timeout=180


      # Build the real native renderer in the same Windows job so the opt-in
      # integration tests can verify a complete UST -> NoteEvent -> WAV path.
      - name: Build VO-SE Core DLL for native render integration
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          set -euo pipefail
          mkdir -p bin src/world build/windows-world
          cp assets/src/*.cpp src/
          cp assets/src/world/*.cpp src/world/
          cp include/world/*.h src/world/
          cp include/*.h src/

          test -s src/vose_core.cpp
          test -s src/vose_streaming_final.cpp
          compgen -G 'src/world/*.cpp' > /dev/null
          compgen -G 'src/world/*.h' > /dev/null

          world_objects=()
          for source in src/world/*.cpp; do
            object="build/windows-world/$(basename "${source%.cpp}").obj"
            cl.exe /nologo /std:c++17 /EHsc /O2 /D_USE_MATH_DEFINES \
              /I src /I include /I src/world /c "$source" "/Fo$object"
            world_objects+=("$object")
          done

          cl.exe /nologo /std:c++17 /EHsc /O2 /LD /D_USE_MATH_DEFINES \
            /Fe:bin/vose_core.dll \
            src/vose_core.cpp src/vose_streaming_final.cpp "${world_objects[@]}" \
            /I src /I include /I src/world /link
          test -s bin/vose_core.dll

      - name: Verify imported UST -> native WAV -> playback
        shell: bash
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: ffmpeg
          VOSE_RUN_NATIVE_RENDER_TEST: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          python -m pytest tests/test_multi_pitch_render_playback.py -v -m integration --maxfail=1

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-pytest-coverage
          path: coverage.xml
          if-no-files-found: ignore
