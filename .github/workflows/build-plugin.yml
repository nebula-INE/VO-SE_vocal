name: Build JUCE Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # ★ キャッシュキーに焼き込む JUCE バージョン（CMakeLists.txt と必ず同期させる）
  JUCE_VERSION: "8.0.5"
  # ★ キャッシュのスキーマバージョン（path や構造を変えたら上げる）
  CACHE_SCHEMA: "v3"

jobs:
  build:
    name: Build Plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Debug: 古いキャッシュの出所を調査 ---
      - name: Debug: where does the stale cache come from?
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "=== 1. build dir right after checkout ==="
          ls -la juce_plugin/build/ 2>/dev/null || echo "(no build dir)"
          echo "=== 2. Is it committed in git? ==="
          git ls-files | grep -i cmakecache || echo "(none committed)"
          git ls-files juce_plugin/build | head -20
          echo "=== 3. Submodules? ==="
          git submodule status
          echo "=== 4. Cache steps in workflows? ==="
          grep -rn "actions/cache" .github/workflows/ || echo "(no cache actions)"

      # --- Linux 依存関係 ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            libgl1-mesa-dev

      # --- Windows: Visual Studio 環境 ---
      - name: Setup MSVC (Windows only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # ============================================================
      # ★ キャッシュ復元（新ロケーション: ~/.cache/juce-fetchcontent）
      #   CMakeLists.txt の FETCHCONTENT_BASE_DIR と一致させること。
      #   キーには JUCE バージョンと CACHE_SCHEMA を含め、バージョン
      #   が上がったら自動的に別キャッシュになるようにする。
      # ============================================================
      - name: Cache JUCE FetchContent
        uses: actions/cache@v4
        with:
          path: ~/.cache/juce-fetchcontent
          key: juce-fetchcontent-${{ matrix.os }}-${{ env.JUCE_VERSION }}-${{ env.CACHE_SCHEMA }}
          restore-keys: |
            juce-fetchcontent-${{ matrix.os }}-${{ env.JUCE_VERSION }}-

      # ============================================================
      # ★ 解決策 A: 復元された stale な CMake 状態を必ず破棄
      #   ソース (juce-src/) は活かしつつ、絶対パス焼き込み済みの
      #   CMakeCache.txt / CMakeFiles / *.cmake.stamp を削除する。
      # ============================================================
      - name: Purge stale FetchContent CMake state
        shell: bash
        run: |
          set -euo pipefail

          BASE_DIR="$HOME/.cache/juce-fetchcontent"
          if [ ! -d "$BASE_DIR" ]; then
            echo "(no fetchcontent cache dir, nothing to purge)"
            exit 0
          fi

          before=$(find "$BASE_DIR" -name CMakeCache.txt 2>/dev/null | wc -l | tr -d ' ')

          find "$BASE_DIR" -name "CMakeCache.txt" -delete 2>/dev/null || true
          find "$BASE_DIR" -name "CMakeFiles" -type d -exec rm -rf {} + 2>/dev/null || true
          find "$BASE_DIR" -name "*.cmake.stamp" -delete 2>/dev/null || true
          find "$BASE_DIR" -maxdepth 3 -type d -name "*-subbuild" -exec rm -rf {} + 2>/dev/null || true

          after=$(find "$BASE_DIR" -name CMakeCache.txt 2>/dev/null | wc -l | tr -d ' ')
          echo "Purged CMakeCache.txt: before=$before, after=$after"

          if [ -d "$BASE_DIR/juce-src" ] || find "$BASE_DIR" -maxdepth 2 -type d -name "juce-src" | grep -q .; then
            echo "juce-src is present (cache reused, no re-download needed)"
          else
            echo "juce-src is absent (will be re-fetched by FetchContent)"
          fi

      # --- 既存のビルドディレクトリを完全に削除 ---
      - name: Clean build directory
        shell: bash
        run: |
          rm -rf juce_plugin/build
          find . -name "CMakeCache.txt" -delete 2>/dev/null || true
          find . -name "CMakeFiles" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Remaining cache files: $(find . -name CMakeCache.txt | wc -l)"

      # --- CMake 設定 ---
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          COMMON_OPTS="-DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=1.0.0"

          if [ "${{ matrix.os }}" == "macos-14" ]; then
            cmake -B juce_plugin/build -S juce_plugin \
              $COMMON_OPTS \
              -DCMAKE_MODULE_LINKER_FLAGS="-liconv" \
              -DCMAKE_SHARED_LINKER_FLAGS="-liconv" \
              -DCMAKE_EXE_LINKER_FLAGS="-liconv"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            cmake -B juce_plugin/build -S juce_plugin -G "Ninja" $COMMON_OPTS
          else
            cmake -B juce_plugin/build -S juce_plugin $COMMON_OPTS
          fi

      # --- ビルド ---
      - name: Build Plugin
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cmake --build juce_plugin/build --config Release -- -j 4
          else
            cmake --build juce_plugin/build --config Release --parallel 4
          fi

      # --- 成果物アップロード ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vose-plugin-${{ matrix.os }}
          path: |
            juce_plugin/build/**/*_artefacts/Release/VST3/
            juce_plugin/build/**/*_artefacts/Release/AU/
            juce_plugin/build/**/*_artefacts/Release/Standalone/
          if-no-files-found: warn
