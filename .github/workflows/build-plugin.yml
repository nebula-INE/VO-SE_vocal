name: Build JUCE Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Linux 依存関係 ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            libgl1-mesa-dev

      # --- Windows: Visual Studio 環境をセットアップ（🔥 必須） ---
      - name: Setup MSVC (Windows only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # --- FetchContent のキャッシュをクリーン（パス不一致防止） ---
      - name: Clean FetchContent cache
        run: rm -rf build/_deps
        shell: bash

      # --- CMake 設定 ---
      - name: Configure CMake
        shell: bash
        run: |
          # 共通オプション
          COMMON_OPTS="-DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=1.0.0 -DFETCHCONTENT_BASE_DIR=${HOME}/juce_cache --fresh"

          if [ "${{ matrix.os }}" == "macos-14" ]; then
            cmake -B build \
              $COMMON_OPTS \
              -DCMAKE_MODULE_LINKER_FLAGS="-liconv" \
              -DCMAKE_SHARED_LINKER_FLAGS="-liconv" \
              -DCMAKE_EXE_LINKER_FLAGS="-liconv"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows: MSVC 環境が有効になったのでジェネレータを指定可能
            cmake -B build \
              -G "Visual Studio 17 2022" \
              -A x64 \
              $COMMON_OPTS
          else
            # Linux
            cmake -B build $COMMON_OPTS
          fi

      # --- ビルド ---
      - name: Build Plugin
        run: cmake --build build --config Release --parallel 4

      # --- 成果物アップロード ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vose-plugin-${{ matrix.os }}
          path: |
            build/**/*_artefacts/Release/VST3/
            build/**/*_artefacts/Release/AU/
            build/**/*_artefacts/Release/Standalone/
          if-no-files-found: warn
