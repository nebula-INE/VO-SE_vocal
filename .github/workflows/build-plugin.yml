name: Build JUCE Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Linux 依存関係 ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            libgl1-mesa-dev

      # --- Windows: Visual Studio 環境 ---
      - name: Setup MSVC (Windows only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # --- 古いビルドキャッシュを完全に削除（パスを修正） ---
      - name: Clean CMake Cache
        run: rm -rf juce_plugin/build
        shell: bash

      # --- CMake 設定（パスの修正と --fresh の位置変更） ---
      - name: Configure CMake
        shell: bash
        run: |
          COMMON_OPTS="-DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=1.0.0 -DFETCHCONTENT_BASE_DIR=${HOME}/juce_cache"

          if [ "${{ matrix.os }}" == "macos-14" ]; then
            cmake --fresh -B juce_plugin/build -S juce_plugin \
              $COMMON_OPTS \
              -DCMAKE_MODULE_LINKER_FLAGS="-liconv" \
              -DCMAKE_SHARED_LINKER_FLAGS="-liconv" \
              -DCMAKE_EXE_LINKER_FLAGS="-liconv"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            cmake --fresh -B juce_plugin/build -S juce_plugin -G "Ninja" $COMMON_OPTS
          else
            cmake --fresh -B juce_plugin/build -S juce_plugin $COMMON_OPTS
          fi

      # --- ビルド（対象ディレクトリを修正） ---
      - name: Build Plugin
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cmake --build juce_plugin/build --config Release -- -j 4
          else
            cmake --build juce_plugin/build --config Release --parallel 4
          fi
        shell: bash

      # --- 成果物アップロード（パスを修正） ---
      - name: Upload Artifacts
        uses: actions/artifacts/upload-artifact@v4
        with:
          name: vose-plugin-${{ matrix.os }}
          path: |
            juce_plugin/build/**/*_artefacts/Release/VST3/
            juce_plugin/build/**/*_artefacts/Release/AU/
            juce_plugin/build/**/*_artefacts/Release/Standalone/
          if-no-files-found: warn
