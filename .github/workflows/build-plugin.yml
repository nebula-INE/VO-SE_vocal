name: Build JUCE Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Plugin on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --- Debug: 古いキャッシュの出所を調査 ---
      - name: Debug: where does the stale cache come from?
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "=== 1. build dir right after checkout ==="
          ls -la juce_plugin/build/ 2>/dev/null || echo "(no build dir)"
          echo "=== 2. Is it committed in git? ==="
          git ls-files | grep -i cmakecache || echo "(none committed)"
          git ls-files juce_plugin/build | head -20
          echo "=== 3. Submodules? ==="
          git submodule status
          echo "=== 4. Cache steps in workflows? ==="
          grep -rn "actions/cache" .github/workflows/ || echo "(no cache actions)"

      # --- Linux 依存関係 ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libx11-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxcursor-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev \
            libgl1-mesa-dev

      # --- Windows: Visual Studio 環境 ---
      - name: Setup MSVC (Windows only)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # --- 既存のビルドキャッシュを完全に削除 ---
      - name: Clean build directory
        shell: bash
        run: |
          # コミット済みキャッシュ / 前回実行の残骸 / キャッシュ復元のいずれも確実に消す
          rm -rf juce_plugin/build
          find . -name "CMakeCache.txt" -delete 2>/dev/null || true
          find . -name "CMakeFiles" -type d -exec rm -rf {} + 2>/dev/null || true
          echo "Remaining cache files: $(find . -name CMakeCache.txt | wc -l)"

      # ============================================================
      # ★ 解決策 A: キャッシュ復元後に残る stale な CMake 状態を削除
      # ------------------------------------------------------------
      # 背景:
      #   actions/cache は juce-fetchcontent-<OS>-<JUCE版>-v2 のような
      #   キーでキャッシュを復元するが、CMakeCache.txt には
      #   「その時のワークスペース絶対パス」が焼き込まれている。
      #   リポジトリ名が VO-SE6 → VO-SE_vocal のように変わると
      #   FetchContent の subbuild がパス不一致で必ず失敗する。
      #
      # 対処:
      #   ソース (juce-src/) は活かしつつ、パス依存のビルド状態
      #   (CMakeCache.txt / CMakeFiles / *.cmake.stamp) のみ破棄する。
      #   JUCE の再ダウンロードは発生しないため、キャッシュの旨味は残る。
      #
      # 注意:
      #   このステップは「actions/cache の復元より後」に実行される必要がある。
      #   もし actions/cache ステップが別ワークフロー / reusable workflow
      #   から呼ばれており、それが Configure CMake より前に実行されるなら
      #   ここで問題ない。もし後から復元される場合は、このステップを
      #   その復元ステップの直後に移動すること。
      # ============================================================
      - name: Purge stale FetchContent CMake state
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="juce_plugin/build"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "(no build dir, nothing to purge)"
            exit 0
          fi

          before=$(find "$TARGET_DIR" -name CMakeCache.txt 2>/dev/null | wc -l | tr -d ' ')

          # 絶対パス焼き込み済みの CMakeCache.txt を全削除
          find "$TARGET_DIR" -name "CMakeCache.txt" -delete 2>/dev/null || true

          # 生成済みの CMake 内部ディレクトリを削除
          find "$TARGET_DIR" -name "CMakeFiles" -type d -exec rm -rf {} + 2>/dev/null || true

          # FetchContent のスタンプ（再 configure を防ぐ）を削除
          find "$TARGET_DIR" -name "*.cmake.stamp" -delete 2>/dev/null || true

          # juce-subbuild の subbuild キャッシュも明示的に掃除
          rm -rf "$TARGET_DIR/_deps/juce-subbuild/CMakeCache.txt" \
                 "$TARGET_DIR/_deps/juce-subbuild/CMakeFiles" \
                 2>/dev/null || true

          after=$(find "$TARGET_DIR" -name CMakeCache.txt 2>/dev/null | wc -l | tr -d ' ')
          echo "Purged CMakeCache.txt: before=$before, after=$after"

          # juce-src が残っているか（= 再ダウンロード不要か）を確認
          if [ -d "$TARGET_DIR/_deps/juce-src" ]; then
            echo "juce-src is present (cache reused, no re-download needed)"
          else
            echo "juce-src is absent (will be re-fetched by FetchContent)"
          fi

      # --- CMake 設定 ---
      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          COMMON_OPTS="-DCMAKE_BUILD_TYPE=Release -DPROJECT_VERSION=1.0.0"

          if [ "${{ matrix.os }}" == "macos-14" ]; then
            cmake -B juce_plugin/build -S juce_plugin \
              $COMMON_OPTS \
              -DCMAKE_MODULE_LINKER_FLAGS="-liconv" \
              -DCMAKE_SHARED_LINKER_FLAGS="-liconv" \
              -DCMAKE_EXE_LINKER_FLAGS="-liconv"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            cmake -B juce_plugin/build -S juce_plugin -G "Ninja" $COMMON_OPTS
          else
            cmake -B juce_plugin/build -S juce_plugin $COMMON_OPTS
          fi

      # --- ビルド ---
      - name: Build Plugin
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cmake --build juce_plugin/build --config Release -- -j 4
          else
            cmake --build juce_plugin/build --config Release --parallel 4
          fi

      # --- 成果物アップロード ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vose-plugin-${{ matrix.os }}
          path: |
            juce_plugin/build/**/*_artefacts/Release/VST3/
            juce_plugin/build/**/*_artefacts/Release/AU/
            juce_plugin/build/**/*_artefacts/Release/Standalone/
          if-no-files-found: warn
