name: Validate Linux runtime package

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-runtime-package.yml"
      - ".github/workflows/release.yml"
      - "requirements-runtime.txt"
      - "requirements-training.txt"
      - "main.py"
      - "modules/**"
      - "assets/**"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "scripts/audit_linux_runtime_bundle.py"
      - "build/**"
      - "packaging/pyinstaller-hooks/**"
      - "bin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-linux-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-linux-runtime:
    name: Build and inspect Linux runtime bundle
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      QT_MEDIA_BACKEND: ffmpeg
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git \
            libsndfile1-dev portaudio19-dev swig \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxrender1 libxi6 libsm6 libxext6 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
            libasound2t64 libportaudio2

      - name: Install runtime dependencies only
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel "setuptools<82"
          python -m pip install --upgrade pyopenjtalk-prebuilt
          python -m pip install -r requirements-runtime.txt
          python -m pip install Pillow PySide6 sounddevice soundfile pytest pyinstaller ruff pyright python-rtmidi mido
          python - <<'PY'
          import importlib.util
          forbidden = ("torch", "torchaudio", "triton", "transformers", "peft")
          found = [name for name in forbidden if importlib.util.find_spec(name) is not None]
          print("Training-only modules installed:", found)
          if found:
              raise SystemExit(f"Unexpected training modules in runtime environment: {found}")
          from PySide6 import QtCore, QtGui, QtWidgets, QtMultimedia
          import importlib.util
          import soundfile, pyopenjtalk
          if importlib.util.find_spec("sounddevice") is None:
              raise ImportError("sounddevice package is not installed")
          try:
              import sounddevice
          except Exception as exc:
              # Headless GitHub runners may not expose a PulseAudio server.
              # The package must be installed; an unavailable host audio device
              # is not a dependency/import failure for the desktop application.
              if type(exc).__name__ != "PortAudioError":
                  raise
              print("PortAudio device unavailable in headless CI; package is installed:", exc)
          assert QtMultimedia.QMediaPlayer is not None
          assert QtMultimedia.QAudioOutput is not None
          from modules.tools import batch_voice_optimizer
          from modules.tools.batch_voice_optimizer import BatchVoiceOptimizer
          assert batch_voice_optimizer.TORCH_AVAILABLE is False, (
              "Runtime validation must not have PyTorch installed"
          )
          assert BatchVoiceOptimizer is not None
          print("Qt:", QtCore.qVersion())
          print("Runtime import smoke: OK")
          print("Optional BatchVoiceOptimizer import without PyTorch: OK")
          PY

          # Pillow is installed in the runner but must not be importable for
          # this probe. Verify Qt's own PNG/SVG readers cover the app assets.
          python - <<'PY'
          import importlib.abc
          import sys

          class _BlockPILImports(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname == "PIL" or fullname.startswith("PIL."):
                      raise ModuleNotFoundError(
                          f"Pillow/PIL is intentionally unavailable: {fullname}"
                      )
                  return None

          sys.meta_path.insert(0, _BlockPILImports())
          from PySide6.QtGui import QIcon, QImage

          png = QImage("assets/dmg_bg.png")
          assert not png.isNull(), "Qt could not load the app's PNG asset without Pillow"
          svg = QIcon("assets/icons/dark/play.svg")
          assert not svg.isNull(), "Qt could not load the app's SVG icon without Pillow"
          from modules.tools import batch_voice_optimizer
          assert batch_voice_optimizer.TORCH_AVAILABLE is False
          print("Qt PNG/SVG assets load with Python Pillow/PIL blocked: OK")
          PY

          # VO-SE uses scipy.signal, scipy.fft and scipy.linalg but has no
          # scipy.optimize usage. Block only SciPy's optional HiGHS solver.
          python - <<'PY'
          import importlib.abc
          import sys

          class _BlockHighsImports(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if (
                      fullname == "scipy.optimize._highspy"
                      or fullname.startswith("scipy.optimize._highspy.")
                  ):
                      raise ModuleNotFoundError(
                          f"SciPy HiGHS solver is intentionally unavailable: {fullname}"
                      )
                  return None

          sys.meta_path.insert(0, _BlockHighsImports())
          from scipy.fft import rfft, rfftfreq
          from scipy.linalg import solve_toeplitz
          from scipy.signal import find_peaks, hilbert, lfilter

          assert rfft is not None and rfftfreq is not None
          assert solve_toeplitz is not None
          assert find_peaks is not None and hilbert is not None and lfilter is not None
          print("SciPy signal/FFT/linalg imports work with HiGHS blocked: OK")
          PY

          # Cython is a build-time dependency of pyopenjtalk-prebuilt. Verify
          # its compiled extensions import in a clean process with Python-level
          # Cython modules unavailable, before excluding Cython from the bundle.
          python - <<'PY'
          import importlib.abc
          import sys

          class _BlockCythonImports(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname == "Cython" or fullname.startswith("Cython."):
                      raise ModuleNotFoundError(
                          f"Cython is intentionally unavailable at runtime: {fullname}"
                      )
                  return None

          sys.meta_path.insert(0, _BlockCythonImports())
          import pyopenjtalk
          from pyopenjtalk import htsengine, openjtalk

          assert pyopenjtalk is not None
          assert htsengine is not None
          assert openjtalk is not None
          print("pyopenjtalk compiled runtime imports without Python Cython: OK")
          PY

      - name: Generate voice data header
        run: python modules/tools/pack_all_voices.py

      - name: Build native WORLD core
        run: |
          set -euo pipefail
          # PR #35 moved native sources from src/ to assets/src/.
          # Stage them into the legacy build layout before compiling.
          mkdir -p bin build/linux-world src/world
          cp assets/src/*.cpp src/
          cp assets/src/world/*.cpp src/world/
          cp include/world/*.h src/world/
          cp include/*.h src/
          for f in src/world/*.cpp; do
            [ -e "$f" ] || continue
            obj="build/linux-world/$(basename "${f%.cpp}").o"
            g++ -O3 -fPIC -c -std=c++17 -D_USE_MATH_DEFINES \
              -I./src -I./include -I./src/world "$f" -o "$obj"
          done
          g++ -O3 -fPIC -shared -std=c++17 -Wl,-soname,libvose_core.so \
            -I./src -I./include -I./src/world -o bin/libvose_core.so \
            src/vose_core.cpp src/vose_streaming_final.cpp build/linux-world/*.o
          test -s bin/libvose_core.so

      - name: Audit optional Qt module references
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # These optional modules are candidates for exclusion from the Linux
          # validation artifact only. Qt Multimedia is deliberately retained.
          pattern = re.compile(
              r"PySide6\s*\.\s*(?:QtWebEngine(?:Core|Widgets|Quick)?|QtDesigner|QtNetwork|QtPdf(?:Widgets)?|QtMultimediaWidgets|QtVirtualKeyboard(?:Qml)?)"
              r"|\bQ(?:WebEngine|Designer|Network|Pdf|VideoWidget)\w*",
              re.IGNORECASE,
          )
          roots = (Path("main.py"), Path("modules"), Path("assets"))
          allowed_suffixes = {".py", ".qml", ".ui", ".qrc", ".json", ".toml"}
          ignored_parts = {".git", ".venv", "venv", "__pycache__", "build", "dist"}

          scanned = 0
          hits = []
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix.lower() not in allowed_suffixes:
                      continue
                  if ignored_parts.intersection(path.parts):
                      continue
                  try:
                      lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                  except OSError:
                      continue
                  scanned += 1
                  for line_number, line in enumerate(lines, 1):
                      if pattern.search(line):
                          hits.append(f"{path}:{line_number}:{line.strip()}")

          # Pillow is an optional convenience library, not the desktop's Qt image path.
          pil_pattern = re.compile(
              r"(?:^|\s)(?:from\s+PIL\b|import\s+PIL\b|PIL\.Image\b)"
          )
          pil_hits = []
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix.lower() != ".py":
                      continue
                  if ignored_parts.intersection(path.parts):
                      continue
                  try:
                      lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                  except OSError:
                      continue
                  for line_number, line in enumerate(lines, 1):
                      if pil_pattern.search(line):
                          pil_hits.append(f"{path}:{line_number}:{line.strip()}")

          print(f"Optional Qt source audit scanned {scanned} files")
          if pil_hits:
              print("\n".join(pil_hits))
              raise SystemExit("Pillow/PIL references found; do not exclude Pillow")
          scipy_optimize_pattern = re.compile(
              r"(?:from\s+scipy\s+import\s+optimize\b|"
              r"from\s+scipy\.optimize\b|import\s+scipy\.optimize\b)"
          )
          scipy_optimize_hits = []
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix.lower() != ".py":
                      continue
                  if ignored_parts.intersection(path.parts):
                      continue
                  try:
                      lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                  except OSError:
                      continue
                  for line_number, line in enumerate(lines, 1):
                      if scipy_optimize_pattern.search(line):
                          scipy_optimize_hits.append(f"{path}:{line_number}:{line.strip()}")

          print("No Pillow/PIL source references found.")
          if scipy_optimize_hits:
              print("\n".join(scipy_optimize_hits))
              raise SystemExit("scipy.optimize references found; do not exclude HiGHS")
          print("No scipy.optimize source references found.")
          if hits:
              print("\n".join(hits))
              raise SystemExit(
                  "QtWebEngine/QtDesigner references found; review exclusions before packaging"
              )
          print("No QtWebEngine or QtDesigner references found.")
          print("Qt Multimedia remains enabled and is not an exclusion candidate.")
          PY

      - name: Build PyInstaller desktop bundle
        run: |
          set -euo pipefail
          python -m PyInstaller --noconsole --clean --onefile \
            --additional-hooks-dir=packaging/pyinstaller-hooks \
            --paths . --paths modules \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --hidden-import=PySide6.QtMultimedia \
            --exclude-module=PySide6.QtWebEngineCore \
            --exclude-module=PySide6.QtWebEngineWidgets \
            --exclude-module=PySide6.QtWebEngineQuick \
            --exclude-module=PySide6.QtWebEngine \
            --exclude-module=PySide6.QtDesigner \
            --exclude-module=PySide6.QtQml \
            --exclude-module=PySide6.QtQuick \
            --exclude-module=PySide6.Qt3DAnimation \
            --exclude-module=PySide6.Qt3DCore \
            --exclude-module=PySide6.Qt3DRender \
            --exclude-module=PySide6.QtNetwork \
            --exclude-module=PySide6.QtPdf \
            --exclude-module=PySide6.QtPdfWidgets \
            --exclude-module=PySide6.QtMultimediaWidgets \
            --exclude-module=PySide6.QtVirtualKeyboard \
            --exclude-module=PySide6.QtVirtualKeyboardQml \
            --exclude-module=Cython \
            --exclude-module=PIL \
            --exclude-module=scipy.optimize._highspy \
            --hidden-import=modules.gui.main_window \
            --hidden-import=PySide6.QtMultimedia \
            --hidden-import=rtmidi \
            --hidden-import=mido.backends.rtmidi \
            --hidden-import=backports \
            --hidden-import=backports.tarfile \
            --collect-all=sounddevice \
            --collect-all=soundfile \
            --collect-all=pyopenjtalk \
            --add-data "bin/libvose_core.so:bin" \
            --add-data "assets:assets" \
            --add-data "modules:modules" \
            --name VO-SE_vocal_Linux main.py
          test -s dist/VO-SE_vocal_Linux
          chmod +x dist/VO-SE_vocal_Linux
          stat -c 'Linux executable bytes=%s' dist/VO-SE_vocal_Linux
          du -h dist/VO-SE_vocal_Linux

      - name: Inspect packaged dependency archive
        run: |
          set -euo pipefail
          python - <<'PY'
          from PyInstaller.archive.readers import CArchiveReader
          path = "dist/VO-SE_vocal_Linux"
          archive = CArchiveReader(path)
          rows = []
          for name, entry in archive.toc.items():
              try:
                  offset, compressed_size, uncompressed_size, *_ = entry
                  rows.append((name.lower(), int(uncompressed_size), int(compressed_size)))
              except (TypeError, ValueError):
                  continue
          forbidden = (
              "torch/", "torch.", "torchaudio", "triton", "nvidia/", "transformers", "peft",
              "qtwebengine", "qwebengine", "qtdesigner", "qdesigner",
          )
          hits = [(name, unpacked, packed) for name, unpacked, packed in rows
                  if any(token in name for token in forbidden)]
          print("Archive entries inspected:", len(rows))
          pdf_members = [
              name for name, _, _ in rows
              if (
                  name.endswith("/plugins/imageformats/libqpdf.so")
                  or name.endswith("/lib/libqt6pdf.so.6")
                  or name.endswith("/lib/libqt6pdf.so")
                  or name == "libqt6pdf.so.6"
              )
          ]
          print("Removed PDF-only Qt payload present:", pdf_members)
          if pdf_members:
              raise SystemExit("Unused Qt PDF plugin/library remains in validation bundle")

          cython_members = [
              name for name, _, _ in rows
              if name.lower().startswith("cython/")
          ]
          cython_packed_bytes = sum(
              packed for name, _, packed in rows if name.lower().startswith("cython/")
          )
          print(
              "Cython build-tool payload present:",
              cython_members,
              "packed bytes:",
              cython_packed_bytes,
          )
          if cython_members:
              raise SystemExit("Cython package modules remain in runtime validation bundle")

          pillow_members = [
              name for name, _, _ in rows
              if (
                  name.startswith("pil/")
                  or name.startswith("pillow/")
                  or name.startswith("pillow.libs/")
                  or name.startswith("pillow-")
              )
          ]
          pillow_packed_bytes = sum(
              packed for name, _, packed in rows
              if (
                  name.startswith("pil/")
                  or name.startswith("pillow/")
                  or name.startswith("pillow.libs/")
                  or name.startswith("pillow-")
              )
          )
          print(
              "Pillow/PIL payload present:",
              pillow_members,
              "packed bytes:",
              pillow_packed_bytes,
          )
          if pillow_members:
              raise SystemExit("Pillow/PIL modules remain in runtime validation bundle")

          highspy_members = [
              name for name, _, _ in rows
              if (
                  name.startswith("scipy/optimize/_highspy/")
                  or name.startswith("scipy.optimize._highspy")
              )
          ]
          highspy_packed_bytes = sum(
              packed for name, _, packed in rows
              if (
                  name.startswith("scipy/optimize/_highspy/")
                  or name.startswith("scipy.optimize._highspy")
              )
          )
          print(
              "SciPy HiGHS solver payload present:",
              highspy_members,
              "packed bytes:",
              highspy_packed_bytes,
          )
          if highspy_members:
              raise SystemExit("SciPy HiGHS solver modules remain in runtime validation bundle")

          imageformat_plugins = {
              name.rsplit("/", 1)[-1]
              for name, _, _ in rows
              if "/plugins/imageformats/" in name
          }
          required_image_plugins = {"libqjpeg.so", "libqico.so", "libqsvg.so", "libqwebp.so"}
          missing_image_plugins = sorted(required_image_plugins - imageformat_plugins)
          print("Retained image format plugins:", sorted(imageformat_plugins))
          if missing_image_plugins:
              raise SystemExit(
                  f"Required non-PDF image format plugins missing: {missing_image_plugins}"
              )
          print("Non-PDF image format plugin preservation: OK")
          print("Largest embedded entries (unpacked bytes):")
          for name, unpacked, packed in sorted(rows, key=lambda row: row[1], reverse=True)[:30]:
              print(f"{unpacked:>12} unpacked | {packed:>12} packed | {name}")
          optional_qt_tokens = (
              "qtmultimediawidgets", "qtpdf", "qtvirtualkeyboard", "qtquick", "qtqml",
          )
          optional_qt_hits = [
              name for name, _, _ in rows
              if any(token in name for token in optional_qt_tokens)
          ]
          print("Optional Qt candidate entries remaining:", optional_qt_hits[:50])
          print("Forbidden training/CUDA entries:", hits[:30])
          if hits:
              raise SystemExit("Training/CUDA libraries unexpectedly present in runtime bundle")
          PY

      - name: Pack and report downloadable artifact size
        run: |
          set -euo pipefail
          mkdir -p dist_out
          tar -C dist -czf dist_out/VO-SE_vocal_Linux_x86_64.tar.gz VO-SE_vocal_Linux
          stat -c 'Executable bytes=%s' dist/VO-SE_vocal_Linux
          stat -c 'Tarball bytes=%s' dist_out/VO-SE_vocal_Linux_x86_64.tar.gz
          du -h dist_out/VO-SE_vocal_Linux_x86_64.tar.gz

      - name: Generate detailed runtime size report
        run: |
          set -euo pipefail
          python scripts/audit_linux_runtime_bundle.py \
            --binary dist/VO-SE_vocal_Linux \
            --tarball dist_out/VO-SE_vocal_Linux_x86_64.tar.gz \
            --json-output dist_out/linux-runtime-size-report.json \
            --baseline-tarball-bytes 401936365
          python -m pytest tests/test_linux_runtime_bundle_audit.py -q

      - name: Desktop startup smoke test
        shell: bash
        run: |
          set -uo pipefail
          set +e
          timeout --signal=TERM --kill-after=10s 45s ./dist/VO-SE_vocal_Linux
          rc=$?
          set -e
          echo "GUI startup smoke exit code: $rc"
          # The desktop app must remain alive until the timeout; an early clean
          # exit is not sufficient evidence that the GUI successfully started.
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
            echo "Expected the GUI process to remain alive until timeout; got exit code $rc"
            exit 1
          fi

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: VO-SE-vocal-Linux-runtime-validation
          path: |
            dist_out/VO-SE_vocal_Linux_x86_64.tar.gz
            dist_out/linux-runtime-size-report.json
          if-no-files-found: error
          retention-days: 7
