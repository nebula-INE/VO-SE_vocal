name: Pytest smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pytest-smoke.yml"
      - "requirements-runtime.txt"
      - "requirements.txt"
      - "main.py"
      - "modules/**"
      - "tests/**"
      - "src/**"
      - "include/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest-smoke:
    name: Run pytest smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QT_MEDIA_BACKEND: ffmpeg
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git \
            libsndfile1-dev portaudio19-dev swig \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxrender1 libxi6 libsm6 libxext6 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0 \
            libasound2t64 libportaudio2

      - name: Install runtime and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel "setuptools<82"
          python -m pip install --upgrade pyopenjtalk-prebuilt
          python -m pip install -r requirements-runtime.txt
          python -m pip install pytest pytest-xdist pytest-cov pytest-qt

      - name: Run smoke tests
        run: python -m pytest tests/ -v -m smoke --maxfail=1
