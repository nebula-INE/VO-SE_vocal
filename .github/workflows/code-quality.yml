name: Code Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/src/**"
      - "modules/**"
      - "tests/**"
      - "main.py"
      - "server.js"
      - "package.json"
      - "eslint.config.js"
      - "pyproject.toml"
      - ".github/workflows/code-quality.yml"
  push:
    branches: [main]
    paths:
      - "assets/src/**"
      - "modules/**"
      - "tests/**"
      - "main.py"
      - "server.js"
      - "package.json"
      - "eslint.config.js"
      - "pyproject.toml"
      - ".github/workflows/code-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-lint:
    name: ESLint (Web + Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Node dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint:web

  python-lint:
    name: Ruff (Desktop + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Run Ruff
        run: python -m ruff check modules tests main.py
